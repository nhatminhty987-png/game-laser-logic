<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Logic Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#89b4fa">
</head>
<body>

    <div class="game-container">
        <h1 id="levelTitle">Laser Logic Puzzle</h1>
        
        <!-- Thanh điều khiển với nút chuyển màn Trước / Sau -->
        <div class="controls">
            <button id="prevBtn" title="Màn trước">◀</button>
            <select id="levelSelect"></select>
            <button id="nextBtn" title="Màn tiếp theo">▶</button>
            <button id="resetBtn">🔄 Chơi lại</button>
            <button id="clearDataBtn" class="btn-danger">🗑️ Xóa dữ liệu</button>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="instructions">
            <p><strong>Cách chơi:</strong> Click vào các ô gương <b>/</b> hoặc <b>\</b> để xoay hướng phản xạ laser sao cho tia chạm vào MỤC TIÊU (ô tròn).</p>
        </div>
    </div>

   <!-- Nạp toàn bộ script theo thứ tự -->
    <script src="grid.js"></script>
    <script src="levelManager.js"></script>
    <script src="levelGenerator.js"></script> <!-- Thêm file AI Generator tại đây -->
    <script src="audioManager.js"></script>
    <script src="laserAnimator.js"></script>
    <script src="confetti.js"></script>
    <script src="game.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
